<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanzi Notes</title>
<meta name="theme-color" content="#F3F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#252527" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hanzi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg-soft:#FAFAFC; --card:#FFFFFF; --side:#F3F2F7; --side-line:#E1E0E6; --line:#ECECEF; --line-soft:#F3F3F5;
  --text:#1D1D1F; --text-2:#3A3A3C; --muted:#6E6E73; --sel:#E2E1E8; --seg:#EFEFF2; --seg-on:#FFFFFF;
  --field:#FFFFFF; --field-line:#D2D2D7; --accent:#0064D2; --on-accent:#FFFFFF; --accent-tint:#E6EEFA;
  --t1:#C8312A; --t2:#B45F06; --t3:#1E7D45; --t4:#2453C7; --t0:#6E6E73;
  --new-bg:#E3ECFA; --new-fg:#1B4BA8; --lrn-bg:#FCEEDC; --lrn-fg:#8A4300; --kn-bg:#E2F3E8; --kn-fg:#17643A;
  --bad-bg:#FBE4E2; --bad-fg:#8F1A12; --warn-soft:#FBF4F2; --streak:#C2410C; --shadow:0 12px 40px rgba(0,0,0,.08);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,"Noto Sans SC",sans-serif;
  --zh:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --py:"Segoe UI","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,Arial,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1E20; --bg-soft:#19191B; --card:#232326; --side:#252527; --side-line:#38383A; --line:#2E2E31; --line-soft:#29292C;
    --text:#F2F2F7; --text-2:#D1D1D6; --muted:#A1A1A6; --sel:#3A3A3E; --seg:#2C2C2F; --seg-on:#48484C;
    --field:#2A2A2D; --field-line:#48484C; --accent:#1F6FE0; --on-accent:#FFFFFF; --accent-tint:#1E3150;
    --t1:#FF7A6E; --t2:#F2A14A; --t3:#5BC985; --t4:#7FA7FF; --t0:#A1A1A6;
    --new-bg:#1E3150; --new-fg:#AFC8FF; --lrn-bg:#45300F; --lrn-fg:#F7C989; --kn-bg:#173A26; --kn-fg:#9BE0B4;
    --bad-bg:#4A1E1A; --bad-fg:#FFB4AB; --warn-soft:#2E2220; --streak:#F28A4B; --shadow:0 12px 40px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1E20; --bg-soft:#19191B; --card:#232326; --side:#252527; --side-line:#38383A; --line:#2E2E31; --line-soft:#29292C;
  --text:#F2F2F7; --text-2:#D1D1D6; --muted:#A1A1A6; --sel:#3A3A3E; --seg:#2C2C2F; --seg-on:#48484C;
  --field:#2A2A2D; --field-line:#48484C; --accent:#1F6FE0; --on-accent:#FFFFFF; --accent-tint:#1E3150;
  --t1:#FF7A6E; --t2:#F2A14A; --t3:#5BC985; --t4:#7FA7FF; --t0:#A1A1A6;
  --new-bg:#1E3150; --new-fg:#AFC8FF; --lrn-bg:#45300F; --lrn-fg:#F7C989; --kn-bg:#173A26; --kn-fg:#9BE0B4;
  --bad-bg:#4A1E1A; --bad-fg:#FFB4AB; --warn-soft:#2E2220; --streak:#F28A4B; --shadow:0 12px 40px rgba(0,0,0,.45);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.zh{font-family:var(--zh)}
[hidden]{display:none!important}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t0{color:var(--t0)}.tx{color:inherit}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- layout ---- */
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.side{width:232px;flex-shrink:0;background:var(--side);border-right:1px solid var(--side-line);display:flex;flex-direction:column;gap:2px;padding:14px 10px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 14px;font-weight:600;font-size:14px}
.brand .mark{width:24px;height:24px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--zh);font-size:14px}
.search{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;background:var(--seg);border-radius:7px;color:var(--muted);margin-bottom:10px}
.search input{border:0;background:transparent;outline:none;width:100%;font-size:13px;color:var(--text)}
.sec{font-size:11px;font-weight:600;color:var(--muted);padding:12px 8px 4px}
.nav{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:6px;font-size:13px;color:var(--text);text-decoration:none}
.nav:hover{background:color-mix(in srgb,var(--sel) 60%,transparent)}
.nav.on{background:var(--sel)}
.nav svg{color:var(--accent);flex-shrink:0}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted)}
.nav .badge{margin-left:auto;font-size:11px;font-weight:600;color:var(--on-accent);background:var(--accent);border-radius:9px;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:10px;border-top:1px solid var(--side-line)}
.streak{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:12px;color:var(--text-2)}
.streak svg{color:var(--streak)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 20px 0 24px;border-bottom:1px solid var(--line);background:var(--bg)}
.bar h1{margin:0;font-size:15px;font-weight:600;white-space:nowrap}
.bar .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.scroll{flex:1;min-height:0;overflow-y:auto}
.tabbar{display:none}

/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--field-line);background:var(--field);font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--bg-soft)}
.btn.primary{border:0;background:var(--accent);color:var(--on-accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border:0;background:transparent}
.btn.ghost:hover{background:var(--seg)}
.btn.danger{color:var(--bad-fg)}
.btn.lg{height:34px;padding:0 16px;font-size:14px;border-radius:8px}
.btn.icon{width:28px;padding:0}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--seg);border-radius:7px;padding:2px}
.seg button{height:24px;padding:0 12px;border:0;border-radius:5px;background:transparent;font-size:12px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--seg-on);box-shadow:0 1px 2px rgba(0,0,0,.12);color:var(--text);font-weight:500}
.chip{height:24px;padding:0 10px;border-radius:12px;border:1px solid var(--field-line);background:var(--field);font-size:12px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.input,.select,.textarea{height:36px;padding:0 10px;border:1px solid var(--field-line);border-radius:8px;background:var(--field);font-size:14px;color:var(--text);outline:none;width:100%}
.textarea{height:auto;min-height:84px;padding:8px 10px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.input.big{height:44px;font-size:22px;font-family:var(--zh)}
.switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;font-size:13px;cursor:pointer;padding:0;color:var(--text)}
.switch .track{width:30px;height:18px;border-radius:9px;background:#C7C7CC;display:flex;align-items:center;padding:0 2px;transition:background .15s}
.switch .knob{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .knob{transform:translateX(12px)}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:3px 9px;border-radius:10px;white-space:nowrap}
.pill.new{background:var(--new-bg);color:var(--new-fg)}.pill.learning{background:var(--lrn-bg);color:var(--lrn-fg)}.pill.known{background:var(--kn-bg);color:var(--kn-fg)}
.pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
kbd{font-family:var(--sans);font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid var(--field-line);color:var(--muted)}

/* ---- cards ---- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:24px;background:var(--bg-soft);min-height:100%;align-content:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:600}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bignum{font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.bars{display:flex;align-items:flex-end;gap:8px;height:92px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.bars i{display:block;width:100%;border-radius:4px;background:color-mix(in srgb,var(--accent) 22%,transparent);min-height:4px}
.bars i.today{background:var(--accent)}
.bars span{font-size:11px;color:var(--muted)}
.week{display:flex;gap:6px}
.week span{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--streak);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--streak) 35%,transparent)}
.week span.on{background:var(--streak);color:#fff;box-shadow:none}
.week span.today{box-shadow:inset 0 0 0 2px var(--streak)}
.wchip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg-soft);cursor:pointer;color:var(--text)}
.wchip .h{font-size:22px;font-family:var(--zh)}
.wchip .py{font-size:12px;font-weight:500}
.wchip .en{font-size:11px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mist{display:flex;gap:10px;padding:10px 12px;background:var(--warn-soft);border-radius:8px}
.mist svg{flex-shrink:0;margin-top:2px;color:var(--bad-fg)}
.empty{padding:40px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .h{font-size:36px;font-family:var(--zh);color:var(--text-2)}

/* ---- vocab ---- */
.split{flex:1;min-height:0;display:flex}
.listcol{flex:1;min-width:0;display:flex;flex-direction:column}
.filters{display:flex;align-items:center;gap:8px;padding:10px 24px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.thead,.vrow{display:grid;grid-template-columns:96px 130px 104px minmax(0,1fr) 76px 84px;gap:12px;align-items:center}
.thead{padding:8px 24px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.vlist{padding:4px 12px 24px}
.vrow{width:100%;min-height:52px;padding:0 12px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer;color:var(--text)}
.vrow:hover{background:var(--bg-soft)}
.vrow.on{background:var(--accent-tint)}
.vrow .h{font-size:22px;font-family:var(--zh)}
.vrow .py{font-size:15px;font-weight:500}
.vrow .en{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .m{font-size:13px;color:var(--muted)}
.inspector{width:320px;flex-shrink:0;border-left:1px solid var(--line);background:var(--bg-soft);padding:28px 24px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:18px;border-bottom:1px solid var(--line);text-align:center}
.hero .h{font-size:64px;line-height:1.1;font-family:var(--zh)}
.hero .py{font-size:22px;font-weight:500}
.dl{margin:0;display:grid;grid-template-columns:100px minmax(0,1fr);row-gap:10px;font-size:13px}
.dl .seg button{padding:0 9px}
.dl dd{min-width:0}
.dl dt{color:var(--muted)}.dl dd{margin:0}
.ex{display:flex;flex-direction:column;gap:4px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.ex .zh{font-size:19px}

/* ---- reader ---- */
.tlist{width:248px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;padding:8px}
.titem{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer;color:var(--text);text-decoration:none}
.titem:hover{background:var(--bg-soft)}
.titem.on{background:var(--accent-tint)}
.titem .zh{font-size:15px;font-weight:500}
.titem small{font-size:12px;color:var(--muted)}
.reader{flex:1;min-width:0;display:flex;flex-direction:column}
.rbody{flex:1;overflow-y:auto;padding:28px 48px 48px;position:relative}
.rtitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.rtitle h2{margin:0;font-size:30px;font-weight:600;font-family:var(--zh)}
.line{display:flex;align-items:flex-start;gap:16px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.spk{flex-shrink:0;margin-top:18px;min-width:28px;height:28px;padding:0 6px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--new-bg);color:var(--new-fg);font-family:var(--zh)}
.spk.b{background:var(--lrn-bg);color:var(--lrn-fg)}
.spk.none{visibility:hidden}
.chars{display:flex;flex-wrap:wrap;gap:0 2px}
.ch{display:inline-flex;flex-direction:column;align-items:center;min-width:calc(var(--rs,28px) + 2px);padding:0 1px;border-radius:5px;border:0;background:transparent;cursor:pointer;color:var(--text)}
.ch:hover{background:var(--seg)}
.ch.hl{background:var(--accent-tint)}
.ch .p{font-size:12px;height:16px;line-height:16px;font-family:var(--py)}
.pyf{font-family:var(--py)}
.trans{display:flex;align-items:baseline;gap:6px}
.trans-btn{border:0;background:transparent;color:var(--accent);font-size:13px;cursor:pointer;padding:2px 0}
.trans-btn:hover{text-decoration:underline}
.trans-edit{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 4px;border-radius:4px;opacity:.6}
.trans-edit:hover{opacity:1;background:var(--seg)}
.ch .c{font-size:var(--rs,28px);line-height:1.45;font-family:var(--zh)}
.ch.punct{cursor:default}.ch.punct:hover{background:transparent}
.nopy .ch .p{visibility:hidden}
.trans{font-size:14px;color:var(--muted);margin-top:2px}
.pop{position:absolute;z-index:5;width:264px;background:var(--card);border:1px solid var(--side-line);border-radius:12px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:6px}
.lineacts{display:flex;gap:2px;margin-top:20px;flex-shrink:0}
.star.on{color:#D98A0B}

/* ---- grammar / exercises ---- */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;padding:24px;background:var(--bg-soft);min-height:100%;align-content:start}
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.formula span{padding:4px 10px;border-radius:6px;background:var(--seg);font-size:14px}
.formula span.kw{background:var(--accent-tint);color:var(--accent);font-family:var(--zh);font-weight:600}
.formula b{color:var(--muted);font-weight:400}
.warnbox{display:flex;gap:8px;padding:10px 12px;background:var(--warn-soft);border-radius:8px;font-size:13px;color:var(--text-2)}
.exlist{padding:16px 24px 32px;display:flex;flex-direction:column;gap:10px}
.exitem{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:16px;align-items:start;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.wrong{text-decoration:line-through;color:var(--bad-fg)}

/* ---- review ---- */
.rv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;background:var(--bg-soft);overflow-y:auto}
.fc{width:min(600px,100%);min-height:360px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px 32px;display:flex;flex-direction:column;align-items:center}
.fc .meta{align-self:stretch;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.fc .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px 0;text-align:center;width:100%}
.fc .big{font-size:84px;line-height:1.1;font-family:var(--zh)}
.fc .bigen{font-size:32px;font-weight:500}
.rates{width:min(600px,100%);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rates button{height:64px;border-radius:12px;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rates b{font-size:15px}.rates small{font-size:12px}
.r1{background:var(--bad-bg);color:var(--bad-fg)}.r2{background:var(--lrn-bg);color:var(--lrn-fg)}.r3{background:var(--kn-bg);color:var(--kn-fg)}.r4{background:var(--new-bg);color:var(--new-fg)}
.progress{width:200px;height:6px;border-radius:3px;background:var(--seg);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}

/* ---- dialog / toast / auth ---- */
dialog{border:1px solid var(--side-line);border-radius:14px;padding:0;background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 48px)}
dialog::backdrop{background:rgba(0,0,0,.3)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 48px)}
.dlg header{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;display:flex;align-items:center}
.dlg .content{padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.dlg footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1D1D1F;color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:50}
#toast button{background:transparent;border:0;color:#8DB8FF;font-weight:600;cursor:pointer}
.auth{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg-soft);padding:24px;overflow-y:auto}
.auth .card{width:min(400px,100%);align-items:center;text-align:center;padding:36px 28px}
.auth .mark{width:64px;height:64px;border-radius:16px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-family:var(--zh)}

<script type="module">
/* =====================================================================
   1. FIREBASE CONFIG — paste your project's web config here.

   (data stays in this browser's localStorage).
   ===================================================================== */
const firebaseConfig = {

};

const CLOUD = !String(firebaseConfig.apiKey).startsWith('PASTE');

/* =====================================================================
   2. HELPERS
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const DAY = 86400000;
const dayKey = (d = new Date()) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
const fmtDate = k => { if (!k) return ''; const d = new Date(k + 'T00:00:00'); return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }); };
const isHan = ch => /\p{Script=Han}/u.test(ch);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const ICON = {
  today: '<path d="M2.5 7.5 8 3l5.5 4.5V13.5h-11z"/><path d="M6.5 13.5v-3.5h3v3.5"/>',

  vocab: '<path d="M4 2.5h8v11l-4-2.5-4 2.5z"/>',
  texts: '<path d="M4 2.5h5.5L12 5v8.5H4z"/><path d="M6 8h4M6 10.5h4"/>',
  grammar: '<rect x="2.5" y="3" width="4.5" height="4.5" rx="1"/><rect x="9" y="3" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9.5" width="11" height="4" rx="1"/>',
  exercises: '<rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="m5.5 8 2 2 3-4"/>',
  settings: '<circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3"/>',
  plus: '<path d="M8 3v10M3 8h10"/>',
  play: '<path d="M3 6.5h2.5L9 3.5v9l-3.5-3H3z"/><path d="M11 6a3 3 0 0 1 0 4"/>',
  flame: '<path d="M8 14c-2.5 0-4-1.7-4-4 0-2.5 2-3.5 2.5-6 1.5 1 2 2.5 2 3.5.7-.5 1-1.3 1-2 1.5 1.2 2.5 2.8 2.5 4.5 0 2.3-1.5 4-4 4z"/>',
  alert: '<circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11h.01"/>',
  star: '<path d="m8 2 1.8 3.8 4.2.5-3.1 2.9.8 4.1L8 11.3l-3.7 2 .8-4.1L2 6.3l4.2-.5z"/>',
  edit: '<path d="M10.5 2.5 13.5 5.5 6 13H3v-3z"/>',
  trash: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 9h5.6l.7-9"/>',
  chev: '<path d="m6 3 5 5-5 5"/>',
  back: '<path d="m10 3-5 5 5 5"/>',
  search: '<circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/>'
};
const ic = (name, size = 16, extra = '') => `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 16 16" fill="${name === 'starOn' ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICON[name === 'starOn' ? 'star' : name]}</svg>`;

/* ---------- pinyin ---------- */
const MARKS = { a: 'āáǎà', e: 'ēéěè', i: 'īíǐì', o: 'ōóǒò', u: 'ūúǔù', 'ü': 'ǖǘǚǜ' };
const UNMARK = {};
for (const [v, s] of Object.entries(MARKS)) [...s].forEach((m, i) => { UNMARK[m] = [v, i + 1]; });

/** "shi4" -> "shì"; "lv4" -> "lǜ"; "de0"/"de" -> "de" */
function sylToMark(s) {
  const m = /^([a-zA-ZüÜ:]+?)([0-5])?$/.exec(s);
  if (!m) return s;
  const body = m[1].replace(/u:|v/g, 'ü').replace(/U:|V/g, 'Ü');
  const t = Number(m[2] || 0);
  if (t < 1 || t > 4) return body;
  const lo = body.toLowerCase();
  let idx = lo.indexOf('a');
  if (idx < 0) idx = lo.indexOf('e');
  if (idx < 0 && lo.includes('ou')) idx = lo.indexOf('o');
  if (idx < 0) for (let i = lo.length - 1; i >= 0; i--) if ('aeiouü'.includes(lo[i])) { idx = i; break; }
  if (idx < 0) return body;
  let mk = MARKS[lo[idx]][t - 1];
  if (body[idx] !== lo[idx]) mk = mk.toUpperCase();
  return body.slice(0, idx) + mk + body.slice(idx + 1);
}
function sylTone(s) { const m = /([0-5])$/.exec(s); const t = m ? Number(m[1]) : 0; return t >= 1 && t <= 4 ? t : 0; }
/** accepts "chāo shì", "chao1 shi4", "lü4", returns numbered "chao1 shi4" */
function normPinyin(str) {
  return String(str || '').trim().split(/[\s']+/).filter(Boolean).map(tok => {
    if (/[0-5]$/.test(tok)) return tok.replace(/u:|v/g, 'ü');
    let tone = 0, out = '';
    for (const ch of tok) {
      const lo = ch.toLowerCase();
      if (UNMARK[lo]) { tone = UNMARK[lo][1]; out += ch === lo ? UNMARK[lo][0] : UNMARK[lo][0].toUpperCase(); }
      else out += ch;
    }
    return out + tone;
  }).join(' ');
}
/** strip tones for search: "chāo shì" / "chao1 shi4" -> "chaoshi" */
const plainPy = s => normPinyin(s).replace(/[0-5\s]/g, '').replace(/ü/g, 'v').toLowerCase();

let pinyinLib = null;
import('https://cdn.jsdelivr.net/npm/pinyin-pro@3/+esm').then(m => { pinyinLib = m.pinyin; scheduleRender(); }).catch(() => toast('Could not load the pinyin library — automatic pinyin is off until you reload.'));

/** numbered syllables for all Han characters in text (context-aware) */
function autoPinyin(text) {
  if (!pinyinLib || !text) return '';
  const han = [...text].filter(isHan).join('');
  if (!han) return '';
  return pinyinLib(han, { toneType: 'num', type: 'array', v: true }).map(s => /[0-5]$/.test(s) ? s : s + '0').join(' ');
}
/** per-character readings for a line, aligned to its characters */
function lineReadings(text) {
  const chars = [...text];
  const han = chars.filter(isHan).join('');
  const arr = (pinyinLib && han) ? pinyinLib(han, { toneType: 'num', type: 'array', v: true }) : [];
  let k = 0;
  return chars.map(c => isHan(c) ? { c, p: arr[k++] || '' } : { c, p: '' });
}
/** pinyin html with tone colours */
function pyHTML(numbered, sep = '') {
  const syl = String(numbered || '').trim().split(/\s+/).filter(Boolean);
  return syl.map(s => {
    const txt = settings.pyStyle === 'num' ? s : sylToMark(s);
    return `<span class="pyf ${settings.tones ? 't' + sylTone(s) : 'tx'}">${esc(txt)}</span>`;
  }).join(sep);
}
const pyPlainText = numbered => String(numbered || '').trim().split(/\s+/).filter(Boolean).map(sylToMark).join(' ');

/* ---------- speech ---------- */
function speak(text) {
  if (!('speechSynthesis' in window) || !text) return toast('Text-to-speech isn’t available in this browser.');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = settings.rate || 0.9;
  const v = speechSynthesis.getVoices().find(v => /zh[-_]CN/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^zh/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---------- spaced repetition (SM-2 style) ---------- */
const NEW_SRS = () => ({ reps: 0, ease: 2.5, interval: 0, due: 0, lapses: 0, seen: false });
/** returns new srs object; interval in days */
function schedule(srs, rating, now = Date.now()) {
  const s = { ...NEW_SRS(), ...(srs || {}) };
  s.seen = true;
  s.last = now;
  if (rating === 1) {
    if (s.reps > 0) s.lapses += 1;
    s.reps = 0; s.interval = 0; s.ease = Math.max(1.3, s.ease - 0.2);
    s.due = now + 60e3;
    return s;
  }
  if (s.interval < 1) {
    // learning phase
    if (rating === 2) { s.interval = 0; s.due = now + 10 * 60e3; s.ease = Math.max(1.3, s.ease - 0.15); return s; }
    s.interval = rating === 4 ? 4 : 1;
  } else if (rating === 2) {
    s.interval = Math.max(1, s.interval * 1.2); s.ease = Math.max(1.3, s.ease - 0.15);
  } else if (rating === 3) {
    s.interval = s.interval * s.ease;
  } else {
    s.interval = s.interval * s.ease * 1.3; s.ease += 0.15;
  }
  s.interval = Math.round(s.interval * 10) / 10;
  s.reps += 1;
  s.due = now + s.interval * DAY;
  return s;
}
function fmtInterval(srs, now = Date.now()) {
  const ms = srs.due - now;
  if (ms < 3600e3) return `${Math.max(1, Math.round(ms / 60e3))} min`;
  if (ms < DAY) return `${Math.round(ms / 3600e3)} h`;
  const d = Math.round(ms / DAY);
  if (d < 31) return `${d} day${d === 1 ? '' : 's'}`;
  return `${Math.round(d / 30)} mo`;
}
function status(item) {
  const s = item.srs;
  if (!s || !s.seen) return 'new';
  return s.interval >= 21 ? 'known' : 'learning';
}
const STATUS_LABEL = { new: 'New', learning: 'Review', known: 'Known' };
/** set a word's status by hand: new = not studied, learning = due for review now, known = pushed 3 weeks out */
function srsForStatus(item, st, now = Date.now()) {
  const cur = { ...NEW_SRS(), ...(item.srs || {}) };
  if (st === 'new') return NEW_SRS();
  if (st === 'known') return { ...cur, seen: true, reps: Math.max(1, cur.reps), interval: 21, due: now + 21 * DAY, last: now };
  return { ...cur, seen: true, reps: Math.max(1, cur.reps), interval: Math.min(Math.max(cur.interval, 1), 20), due: now };
}
function nextReviewLabel(item) {
  const s = item.srs;
  if (!s || !s.seen) return 'Not studied yet';
  const ms = s.due - Date.now();
  if (ms <= 0) return 'Due now';
  if (ms < DAY) return 'Later today';
  const d = Math.ceil(ms / DAY);
  return d === 1 ? 'Tomorrow' : `In ${d} days`;
}

/* =====================================================================
   3. STATE + STORAGE (Firestore or localStorage)
   ===================================================================== */
const COLLS = ['lessons', 'vocab', 'grammar', 'texts', 'exercises'];
const S = { lessons: [], vocab: [], grammar: [], texts: [], exercises: [], meta: {} };
const LS_DATA = 'hanzi-notes-data-v1';
const LS_SET = 'hanzi-notes-settings-v1';
const settings = Object.assign({ tones: true, pyStyle: 'mark', readerPy: true, readerTrans: false, readerSize: 28, newPerSession: 20, rate: 0.9, theme: 'auto' }, JSON.parse(localStorage.getItem(LS_SET) || '{}'));
const saveSettings = () => localStorage.setItem(LS_SET, JSON.stringify(settings));
const applyTheme = () => { if (settings.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = settings.theme; };
applyTheme();

let fb = null; // { db, auth, fs: firestore module, au: auth module }
let user = null;
let unsubs = [];

/* ---------- sync status ---------- */
// auth: 'local' (no config) | 'loading' | 'out' | 'in'
const sync = { auth: CLOUD ? 'loading' : 'local', pending: 0, error: '', online: navigator.onLine, signingIn: false, authMsg: '' };
window.addEventListener('online', () => { sync.online = true; updateSync(); });
window.addEventListener('offline', () => { sync.online = false; updateSync(); });
async function track(p) {
  sync.pending++; updateSync();
  try { await p; sync.error = ''; }
  catch (e) { sync.error = e.message || String(e); throw e; }
  finally { sync.pending--; updateSync(); }
}
function syncState() {
  if (sync.auth === 'local') return { k: 'local', label: 'Local only', detail: 'Saved in this browser only' };
  if (sync.auth === 'loading') return { k: 'busy', label: 'Connecting…', detail: '' };
  if (sync.auth === 'out') return { k: 'out', label: 'Signed out', detail: 'Sign in to load and save your notes' };
  if (sync.error) return { k: 'err', label: 'Sync error', detail: sync.error };
  if (!sync.online) return { k: 'busy', label: 'Offline', detail: sync.pending ? `${plural(sync.pending, 'change')} will sync when you’re back online` : 'Changes will sync when you’re back online' };
  if (sync.pending) return { k: 'busy', label: 'Syncing…', detail: `Saving ${plural(sync.pending, 'change')}` };
  return { k: 'ok', label: 'Synced', detail: user?.email || '' };
}
function syncHTML(compact = false) {
  const s = syncState();
  const btn = sync.auth === 'out'
    ? `<button class="btn primary sync-btn" data-act="signIn" ${sync.signingIn ? 'disabled' : ''}>${sync.signingIn ? 'Signing in…' : 'Sign in'}</button>`
    : sync.auth === 'in' && !compact ? `<button class="btn ghost sync-btn" data-act="signOut">Sign out</button>` : '';
  return `<div class="sync ${s.k}" title="${esc(s.detail)}" role="status"><span class="dot" aria-hidden="true"></span><span class="sync-txt"><b>${s.label}</b>${s.detail && !compact ? `<small>${esc(s.detail)}</small>` : ''}</span>${btn}</div>`;
}
function updateSync() { document.querySelectorAll('[data-sync]').forEach(el => { el.innerHTML = syncHTML(el.dataset.sync === 'compact'); }); }

const store = {
  get cloud() { return !!(fb && user); },
  get canWrite() { return !CLOUD || this.cloud; },
  ref(coll, id) { return fb.fs.doc(fb.db, 'hanzi', user.uid, coll, id); },
  guard() { if (!this.canWrite) { toast('Sign in to save your notes.'); return false; } return true; },
  async put(coll, obj) {
    if (!this.guard()) return obj;
    const now = Date.now();
    obj = { ...obj, id: obj.id || newId(), updated: now, created: obj.created || now };
    const arr = S[coll]; const i = arr.findIndex(x => x.id === obj.id);
    if (i >= 0) arr[i] = obj; else arr.push(obj);
    scheduleRender();
    // Local state updates instantly; the cloud write syncs in the background (Firestore queues it offline).
    if (this.cloud) track(fb.fs.setDoc(this.ref(coll, obj.id), obj)).catch(e => { console.error(e); toast('Couldn’t save: ' + e.message); });
    else saveLocal();
    return obj;
  },
  async putMany(coll, list) {
    if (!this.guard()) return [];
    const now = Date.now();
    const objs = list.map(o => ({ ...o, id: o.id || newId(), updated: now, created: o.created || now }));
    for (const o of objs) { const i = S[coll].findIndex(x => x.id === o.id); if (i >= 0) S[coll][i] = o; else S[coll].push(o); }
    scheduleRender();
    if (this.cloud) {
      for (let i = 0; i < objs.length; i += 400) {
        const b = fb.fs.writeBatch(fb.db);
        objs.slice(i, i + 400).forEach(o => b.set(this.ref(coll, o.id), o));
        track(b.commit()).catch(e => { console.error(e); toast('Couldn’t save: ' + e.message); });
      }
    } else saveLocal();
    return objs;
  },
  async remove(coll, id) {
    if (!this.guard()) return;
    S[coll] = S[coll].filter(x => x.id !== id);
    scheduleRender();
    if (this.cloud) track(fb.fs.deleteDoc(this.ref(coll, id))).catch(e => { console.error(e); toast('Couldn’t delete: ' + e.message); });
    else saveLocal();
  },
  async setMeta(patch) {
    if (!this.guard()) return;
    S.meta = { ...S.meta, ...patch };
    scheduleRender();
    if (this.cloud) track(fb.fs.setDoc(fb.fs.doc(fb.db, 'hanzi', user.uid, 'meta', 'main'), S.meta)).catch(e => console.error(e));
    else saveLocal();
  }
};
function saveLocal() { localStorage.setItem(LS_DATA, JSON.stringify(S)); }
function loadLocal() { try { Object.assign(S, JSON.parse(localStorage.getItem(LS_DATA) || '{}')); } catch { } COLLS.forEach(c => S[c] = S[c] || []); S.meta = S.meta || {}; }
function clearData() { COLLS.forEach(c => { S[c] = []; }); S.meta = {}; ui.rv = null; ui.pop = null; ui.vocab.sel = null; }

const AUTH_MSG = {
  'auth/unauthorized-domain': `This site isn’t on Firebase’s list yet. In Firebase → Authentication → Settings → Authorized domains, add ${location.hostname}.`,
  'auth/popup-blocked': 'The sign-in window was blocked. Allow pop-ups for this site (on iPad: Settings → Safari → turn off Block Pop-ups), then try again.',
  'auth/popup-closed-by-user': 'The sign-in window was closed before finishing. Try again.',
  'auth/cancelled-popup-request': 'Sign-in was interrupted. Try again.',
  'auth/operation-not-allowed': 'Google sign-in isn’t switched on. In Firebase → Authentication → Sign-in method, enable Google.',
  'auth/network-request-failed': 'No connection to Google. Check your internet and try again.',
  'auth/web-storage-unsupported': 'This browser is blocking storage the sign-in needs. Turn off Private Browsing, then try again.'
};
// Popup only (never redirect): the authDomain (*.firebaseapp.com) differs from the app's domain
// (github.io). The redirect flow needs cross-site storage that Safari (iPad/iPhone) and newer
// Chrome/Firefox block, so it silently comes back signed out. The popup flow doesn't need it.
// Called straight from the click so Safari treats the popup as user-initiated.
function signIn() {
  if (!fb) { toast('Still connecting to Firebase…'); return; }
  sync.signingIn = true; sync.authMsg = ''; updateSync(); render();
  fb.au.signInWithPopup(fb.auth, new fb.au.GoogleAuthProvider())
    .catch(e => { console.error('Sign-in failed', e); sync.authMsg = (AUTH_MSG[e.code] || e.message) + (e.code ? ` (${e.code})` : ''); })
    .finally(() => { sync.signingIn = false; updateSync(); render(); });
}
async function signOutNow() {
  if (sync.pending && !confirm(`${plural(sync.pending, 'change')} haven’t synced yet. Sign out anyway?`)) return;
  await fb.au.signOut(fb.auth);
}

async function initCloud() {
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [appM, au, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = appM.initializeApp(firebaseConfig);
  let db;
  try { db = fs.initializeFirestore(app, { ignoreUndefinedProperties: true, localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch { db = fs.getFirestore(app); }
  const auth = au.getAuth(app);
  fb = { db, auth, fs, au };
  au.onAuthStateChanged(auth, u => {
    user = u;
    unsubs.forEach(f => f()); unsubs = [];
    clearData();
    sync.error = ''; sync.pending = 0;
    sync.auth = u ? 'in' : 'out';
    if (u) {
      const onErr = e => { console.error(e); sync.error = e.code === 'permission-denied' ? `This account (${u.email}) isn’t allowed to use this app.` : e.message; updateSync(); };
      COLLS.forEach(c => unsubs.push(fs.onSnapshot(fs.collection(db, 'hanzi', u.uid, c), snap => { S[c] = snap.docs.map(d => d.data()); if (!snap.metadata.fromCache) sync.error = ''; scheduleRender(); }, onErr)));
      unsubs.push(fs.onSnapshot(fs.doc(db, 'hanzi', u.uid, 'meta', 'main'), d => { S.meta = d.data() || {}; scheduleRender(); }, onErr));
    }
    updateSync(); render();
  });
}

const byId = (coll, id) => S[coll].find(x => x.id === id);
const lessonsSorted = () => [...S.lessons].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.num || 0) - (a.num || 0));
const lastLesson = () => lessonsSorted()[0];
const lessonName = id => { const l = byId('lessons', id); return l ? (l.num ? `Lesson ${l.num}` : (l.title || 'Lesson')) : '—'; };
function reviewables() {
  return [...S.vocab.map(item => ({ kind: 'vocab', item })), ...S.grammar.filter(g => g.pattern || g.title).map(item => ({ kind: 'grammar', item }))];
}
function dueList(now = Date.now()) {
  const all = reviewables();
  const due = all.filter(x => x.item.srs && x.item.srs.seen && x.item.srs.due <= now).sort((a, b) => a.item.srs.due - b.item.srs.due);
  const fresh = all.filter(x => !x.item.srs || !x.item.srs.seen).sort((a, b) => (a.item.created || 0) - (b.item.created || 0)).slice(0, settings.newPerSession);
  return [...due, ...fresh];
}
function streak() {
  const days = new Set(S.meta.days || []);
  let n = 0; const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const openMistakes = () => S.exercises.filter(e => e.correct === false && !e.resolved).sort((a, b) => (b.created || 0) - (a.created || 0));
function lessonCounts(id) {
  return { vocab: S.vocab.filter(x => x.lesson === id).length, grammar: S.grammar.filter(x => x.lesson === id).length, texts: S.texts.filter(x => x.lesson === id).length, exercises: S.exercises.filter(x => x.lesson === id).length, mistakes: S.exercises.filter(x => x.lesson === id && x.correct === false).length };
}

    ${v.notes ? `<div style="font-size:13px;color:var(--text-2);white-space:pre-wrap">${esc(v.notes)}</div>` : ''}

    </div>`;
}

/* ---------- texts ---------- */
function parseTextLines(body) {
  return String(body || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    let sp = '', zh = l, en = '';
    const bar = zh.split(/\s*[|｜¦]\s*/); zh = bar[0]; en = bar.slice(1).join(' | ');
    const m = /^([A-Za-z]{1,2}|[\p{Script=Han}]{1,4})\s*[:：]\s*(.+)$/u.exec(zh);
    if (m) { sp = m[1]; zh = m[2]; }
    return { sp, zh, en };
  });
}
function findWordAt(text, idx) {
  const words = S.vocab.filter(v => v.hanzi && text.includes(v.hanzi)).sort((a, b) => b.hanzi.length - a.hanzi.length);
  for (const v of words) {
    let from = 0, k;
    while ((k = text.indexOf(v.hanzi, from)) >= 0) {
      const a = [...text.slice(0, k)].length, b = a + [...v.hanzi].length;
      if (idx >= a && idx < b) return { v, a, b };
      from = k + 1;
    }
  }
  return null;
}
function vTexts() {
  const texts = [...S.texts].sort((a, b) => (b.created || 0) - (a.created || 0));
  const t = ui.param ? byId('texts', ui.param) : null;
  const list = `<div class="tlist ${t ? 'has-sel' : ''}">
    ${texts.map(x => `<a class="titem ${t && t.id === x.id ? 'on' : ''}" href="#/texts/${x.id}"><span class="zh">${esc(x.lesson ? lessonName(x.lesson) + ' · ' : '')}${esc(x.title || 'Untitled')}</span><small>${esc(x.titleEn || '')}${x.titleEn && x.lesson ? ' · ' : ''}${x.lesson ? fmtDate(byId('lessons', x.lesson)?.date) : ''}</small></a>`).join('')
    || `<div class="empty"><span class="h">文</span>No texts yet.<button class="btn primary" data-act="newText">${ic('plus', 12)} Add a text</button></div>`}
  </div>`;
  if (!t) return bar('Texts', plural(texts.length, 'text'), addBtn('newText', 'New text')) + `<div class="split">${list}<div class="reader"><div class="empty" style="margin:auto"><span class="h">读</span>Choose a text to read.</div></div></div>`;

  const lines = parseTextLines(t.body);
  const speakers = [...new Set(lines.map(l => l.sp).filter(Boolean))];
  const saved = new Set(t.saved || []);
  const sw = (key, label) => `<button class="switch" role="switch" aria-checked="${!!settings[key]}" data-act="toggleSetting" data-key="${key}"><span class="track"><span class="knob"></span></span>${label}</button>`;
  const pop = ui.pop && ui.pop.textId === t.id ? ui.pop : null;
  const linesHTML = lines.map((l, li) => {
    const rd = lineReadings(l.zh);
    const hit = pop && pop.line === li ? pop : null;
    const chars = rd.map((r, ci) => {
      if (!isHan(r.c)) return `<span class="ch punct"><span class="p"></span><span class="c">${esc(r.c)}</span></span>`;
      const on = hit && ci >= hit.a && ci < hit.b;
      return `<button class="ch ${on ? 'hl' : ''}" data-act="tapChar" data-line="${li}" data-idx="${ci}"><span class="p ${settings.tones ? 't' + sylTone(r.p) : ''}">${esc(settings.pyStyle === 'num' ? r.p : sylToMark(r.p))}</span><span class="c">${esc(r.c)}</span></button>`;
    }).join('');
    const spIdx = speakers.indexOf(l.sp);
    return `<div class="line" data-line="${li}" style="position:relative">
      <span class="spk ${l.sp ? (spIdx % 2 ? 'b' : '') : 'none'}">${esc(l.sp || '·')}</span>
      <div style="flex:1;min-width:0"><div class="chars">${chars}</div>${!settings.readerTrans ? '' : l.en
        ? `<div class="trans"><span>${esc(l.en)}</span><button class="trans-edit" data-act="editTrans" data-id="${t.id}" data-line="${li}" aria-label="Edit translation">${ic('edit', 12)}</button></div>`
        : `<div class="trans"><button class="trans-btn" data-act="editTrans" data-id="${t.id}" data-line="${li}">+ Add translation</button></div>`}</div>
      <div class="lineacts">
        <button class="btn ghost icon" data-act="speak" data-text="${esc(l.zh)}" aria-label="Play sentence">${ic('play', 15)}</button>
        <button class="btn ghost icon star ${saved.has(li) ? 'on' : ''}" data-act="toggleSaved" data-id="${t.id}" data-line="${li}" aria-pressed="${saved.has(li)}" aria-label="Save sentence to memorise">${ic(saved.has(li) ? 'starOn' : 'star', 15)}</button>
      </div>
      ${hit ? popHTML(hit) : ''}
    </div>`;
  }).join('');
  return bar('Texts', '', `${sw('readerPy', 'Pinyin')}${sw('readerTrans', 'Translation')}<span class="hide-m">${sw('tones', 'Tone colours')}</span>
      <div class="seg hide-m"><button data-act="rSize" data-d="-4" aria-label="Smaller text" style="font-size:11px">A</button><button data-act="rSize" data-d="4" aria-label="Larger text" style="font-size:15px">A</button></div>
      <button class="btn primary" data-act="speak" data-text="${esc(lines.map(l => l.zh).join('。'))}"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg><span class="hide-m">Play all</span></button>`, '#/texts', true) + `
  <div class="split">${list}
    <div class="reader">
      <div class="rbody ${settings.readerPy ? '' : 'nopy'}" style="--rs:${settings.readerSize}px" data-keep-scroll="reader">
        <div class="rtitle"><h2>${esc(t.title || 'Untitled')}</h2><span class="pyf" style="font-size:16px;color:var(--text-2)">${esc(pyPlainText(autoPinyin(t.title)))}</span><span class="muted">${esc(t.titleEn || '')}</span>
          <span style="margin-left:auto;display:flex;gap:6px"><button class="btn" data-act="editText" data-id="${t.id}">${ic('edit', 13)} Edit</button><button class="btn icon danger" data-act="delText" data-id="${t.id}" aria-label="Delete text">${ic('trash', 14)}</button></span></div>
        ${settings.readerTrans && lines.length && !lines.some(l => l.en) ? `<div class="warnbox" style="margin-bottom:12px">${ic('alert', 15, 'style="flex-shrink:0;margin-top:1px"')}<div>No translations yet. Tap <b>+ Add translation</b> under a line, or click Edit and put <b>|</b> then the English at the end of each line.</div></div>` : ''}
        ${linesHTML || '<p class="muted">This text is empty. Click Edit to add lines.</p>'}
        <p class="hint" style="margin-top:18px">Tap a character to look it up or add it. ${saved.size ? `${plural(saved.size, 'sentence')} saved to memorise.` : 'Star sentences you want to memorise for speaking.'}</p>
      </div>

  </div>`;
}
function popHTML(p) {

/* ---------- grammar ---------- */

}
function parseExamples(text) { return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [zh, ...en] = l.split(/\s*[|｜¦]\s*/); return { zh, en: en.join(' | ') }; }); }

        <span style="margin-left:auto;display:flex;gap:4px"><button class="btn ghost icon" data-act="editGrammar" data-id="${x.id}" aria-label="Edit">${ic('edit', 14)}</button><button class="btn ghost icon danger" data-act="delGrammar" data-id="${x.id}" aria-label="Delete">${ic('trash', 14)}</button></span></div>

      ${x.mistake ? `<div class="warnbox">${ic('alert', 15, 'style="color:var(--bad-fg);flex-shrink:0;margin-top:1px"')}<div><b style="font-weight:600">Common mistake</b><div class="zh" style="white-space:pre-wrap">${esc(x.mistake)}</div></div></div>` : ''}
    </article>`).join('') || `<div class="empty" style="grid-column:1/-1"><span class="h">语</span>${S.grammar.length ? 'No grammar points match.' : 'No grammar points yet.'}<button class="btn primary" data-act="newGrammar">${ic('plus', 12)} Add grammar point</button></div>`}
  </div></div>`;
}

/* ---------- review ---------- */
function startReview() {
  const due = dueList();

}
function previewLabel(srs, r) { return fmtInterval(schedule(srs, r)); }
function vReview() {
  const dir = settings.dir || 'h2e';

  const rv = ui.rv;
  if (!rv) {
    const due = dueList();
    return bar('Review', '', seg) + `<div class="rv"><div class="fc" style="min-height:280px"><div class="body">
      <div class="bignum">${plural(due.length, 'card')}</div>

      ${due.length ? `<button class="btn primary lg" data-act="startReview" style="margin-top:16px">Start review <kbd style="color:inherit;border-color:rgba(255,255,255,.4)">Space</kbd></button>` : '<a class="btn lg" href="#/vocab" style="margin-top:16px">Go to vocabulary</a>'}
    </div></div></div>`;
  }
  const itemOf = c => c && byId(c.kind === 'vocab' ? 'vocab' : 'grammar', c.id);
  while (rv.i < rv.queue.length && !itemOf(rv.queue[rv.i])) rv.i += 1; // skip deleted cards
  const cur = rv.queue[rv.i];
  const item = itemOf(cur);
  if (!cur || !item) {
    return bar('Review', '', seg) + `<div class="rv"><div class="fc" style="min-height:280px"><div class="body">
      <div class="zh" style="font-size:48px">好！</div><div class="bignum" style="font-size:28px">Session complete</div>
      <div class="muted">${rv.done} reviewed · ${rv.good} correct · ${rv.again} again</div>
      <div style="display:flex;gap:8px;margin-top:16px"><a class="btn lg" href="#/today">Back to Today</a>${dueList().length ? `<button class="btn primary lg" data-act="startReview">Review more</button>` : ''}</div>
    </div></div></div>`;
  }
  const pct = Math.min(100, Math.round(rv.i / Math.max(1, rv.queue.length) * 100));
  let front, back;
  if (cur.kind === 'vocab') {
    const exPy = item.exPy || autoPinyin(item.example);
    front = dir === 'h2e' ? `<span class="big">${esc(item.hanzi)}</span>` : `<span class="bigen">${esc(item.meaning)}</span>`;
    back = `<span style="font-size:26px;font-weight:500">${pyHTML(item.py)}</span>
      ${dir === 'h2e' ? `<span class="big">${esc(item.hanzi)}</span><span style="font-size:19px;color:var(--text-2)">${esc(item.meaning)}</span>` : `<span class="big">${esc(item.hanzi)}</span><span style="font-size:19px;color:var(--text-2)">${esc(item.meaning)}</span>`}
      ${item.example ? `<div style="margin-top:14px;align-self:stretch;padding:12px 16px;background:var(--bg-soft);border-radius:10px;display:flex;align-items:center;gap:12px;text-align:left"><div style="flex:1"><div style="font-size:13px;color:var(--text-2)">${esc(pyPlainText(exPy))}</div><div class="zh" style="font-size:19px">${esc(item.example)}</div>${item.exampleEn ? `<div class="muted" style="font-size:13px">${esc(item.exampleEn)}</div>` : ''}</div><button class="btn icon" style="border-radius:50%;width:36px;height:36px" data-act="speak" data-text="${esc(item.example)}" aria-label="Play example">${ic('play', 15)}</button></div>` : ''}`;
  } else {
    const ex = parseExamples(item.examples);
    front = `<span class="zh" style="font-size:30px;font-weight:600">${esc(item.title || '')}</span>${item.pattern ? formulaHTML(item.pattern) : ''}<span class="muted" style="font-size:13px;margin-top:8px">Say an example sentence out loud, then check.</span>`;
    back = `${item.explain ? `<div style="font-size:15px;color:var(--text-2);white-space:pre-wrap">${esc(item.explain)}</div>` : ''}${ex.slice(0, 2).map(e => `<div><div style="font-size:13px;color:var(--text-2)">${esc(pyPlainText(autoPinyin(e.zh)))}</div><div class="zh" style="font-size:20px">${esc(e.zh)}</div><div class="muted" style="font-size:13px">${esc(e.en)}</div></div>`).join('')}${item.mistake ? `<div class="warnbox zh">${esc(item.mistake)}</div>` : ''}`;
  }
  const srs = item.srs || NEW_SRS();
  const rates = [[1, 'Again'], [2, 'Hard'], [3, 'Good'], [4, 'Easy']].map(([r, l]) => `<button class="r${r}" data-act="rate" data-r="${r}"><b>${l}</b><small>${previewLabel(srs, r)} · <span class="hide-m">key ${r}</span></small></button>`).join('');
  return bar('Review', '', `${seg}<span class="hide-m" style="font-size:13px;color:var(--text-2)">${rv.i + 1} of ${rv.queue.length}</span><div class="progress hide-m"><i style="width:${pct}%"></i></div><button class="btn ghost" data-act="endReview">End</button>`) + `
  <div class="rv">
    <article class="fc">
      <div class="meta"><span>${cur.kind === 'vocab' ? 'Vocabulary' : 'Grammar'}${item.lesson ? ' · ' + esc(lessonName(item.lesson)) : ''}</span><span>${STATUS_LABEL[status(item)]}</span></div>
      <div class="body">${rv.flipped ? (cur.kind === 'vocab' ? back : front + back) : front}</div>
    </article>
    ${rv.flipped ? `<div class="rates">${rates}</div>` : `<button class="btn primary" style="width:min(600px,100%);height:48px;border-radius:12px;font-size:15px" data-act="flip">Show answer <kbd style="color:inherit;border-color:rgba(255,255,255,.4)">Space</kbd></button>`}
    <div class="muted" style="font-size:13px">Correct ${rv.good} · Again ${rv.again} · ${rv.queue.length - rv.i} left</div>
  </div>`;
}
async function rate(r) {
  const rv = ui.rv; const cur = rv.queue[rv.i];
  const coll = cur.kind === 'vocab' ? 'vocab' : 'grammar';
  const item = byId(coll, cur.id);
  if (!item) return;
  const srs = schedule(item.srs, r);
  rv.done += 1;
  if (r === 1) { rv.again += 1; rv.queue.push(cur); } else rv.good += 1;
  if (r === 2 && srs.interval < 1) rv.queue.push(cur);
  rv.i += 1; rv.flipped = false;
  const days = new Set(S.meta.days || []); const today = dayKey();
  const metaP = days.has(today) ? null : store.setMeta({ days: [...days, today].sort().slice(-400) });
  await store.put(coll, { ...item, srs });
  if (metaP) await metaP;
}

async function submitDialog(fd) {
  const k = formCtx?.kind; if (!k) return;
  const get = n => (fd.get(n) ?? '').toString().trim();
  if (k === 'vocab') {
    const prev = formCtx.id ? byId('vocab', formCtx.id) : {};
    const hanzi = get('hanzi');
    const obj = { ...prev, hanzi, meaning: get('meaning'), py: normPinyin(get('py')) || autoPinyin(hanzi), pos: get('pos'), mw: get('mw'), lesson: get('lesson'), notes: get('notes') };
    const want = get('status') || 'new';
    if ((prev.id ? status(prev) : 'new') !== want) obj.srs = srsForStatus(prev, want);
    settings.lastPos = obj.pos; saveSettings();
    if (!prev.id && S.vocab.some(v => v.hanzi === hanzi) && !confirm(`${hanzi} is already in your vocabulary. Add it again?`)) return;
    const saved = await store.put('vocab', obj);
    ui.vocab.sel = saved.id;
    if (!prev.id && fd.get('another')) { toast(`Added ${hanzi}`); vocabForm({}, { lesson: obj.lesson, pos: obj.pos }); return; }
    toast(prev.id ? 'Saved' : `Added ${hanzi}`);
  } else if (k === 'grammar') {
    await store.put('grammar', { ...(formCtx.id ? byId('grammar', formCtx.id) : {}), title: get('title'), pattern: get('pattern'), explain: get('explain'), examples: get('examples'), mistake: get('mistake'), lesson: get('lesson') });
  } else if (k === 'texts') {
    const saved = await store.put('texts', { ...(formCtx.id ? byId('texts', formCtx.id) : { saved: [] }), title: get('title'), titleEn: get('titleEn'), body: get('body'), lesson: get('lesson') });
    closeDialog(); location.hash = '#/texts/' + saved.id; return;
  } else if (k === 'exercises') {
    await store.put('exercises', { ...(formCtx.id ? byId('exercises', formCtx.id) : {}), question: get('question'), mine: get('mine'), answer: get('answer'), correct: fd.get('correct') !== 'no', note: get('note'), lesson: get('lesson') });
  } else if (k === 'lessons') {
    const saved = await store.put('lessons', { ...(formCtx.id ? byId('lessons', formCtx.id) : {}), date: get('date'), num: get('num') === '' ? null : Number(get('num')), title: get('title'), titleEn: get('titleEn'), notes: get('notes') });
    closeDialog(); location.hash = '#/lesson/' + saved.id; return;
  } else if (k === 'bulk') {
    const lesson = get('lesson');
    const items = get('lines').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const m = /^([\p{Script=Han}·…]+)\s*[,，|\t:：\s]\s*(.*)$/u.exec(l) || [null, l, ''];
      return { hanzi: m[1].trim(), meaning: (m[2] || '').trim(), py: autoPinyin(m[1]), pos: 'Other', lesson };
    }).filter(x => x.hanzi && !S.vocab.some(v => v.hanzi === x.hanzi));
    await store.putMany('vocab', items);
    toast(`Added ${plural(items.length, 'word')}`);
  }
  closeDialog();
}

let toastTimer = null;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" id="undoBtn">Undo</button>' : ''}`;
  t.hidden = false;
  if (undo) $('#undoBtn').onclick = () => { undo(); t.hidden = true; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 6000 : 2500);
}
async function removeWithUndo(coll, id, label) {
  const item = byId(coll, id); if (!item) return;
  await store.remove(coll, id);
  toast(`Deleted ${label}`, () => store.put(coll, item));
}
function charPopup(btn) {
  const t = byId('texts', ui.param); if (!t) return;
  const li = Number(btn.dataset.line), ci = Number(btn.dataset.idx);
  const line = parseTextLines(t.body)[li];
  const chars = [...line.zh];
  const hit = findWordAt(line.zh, ci);
  const lineEl = btn.closest('.line'); const lr = lineEl.getBoundingClientRect(); const br = btn.getBoundingClientRect();
  const left = Math.max(0, Math.min(br.left - lr.left - 20, lr.width - 270));
  const base = { textId: t.id, line: li, left, top: br.bottom - lr.top + 6, ctx: line.zh };
  if (hit) ui.pop = { ...base, a: hit.a, b: hit.b, word: hit.v.hanzi, v: hit.v };
  else ui.pop = { ...base, a: ci, b: ci + 1, word: chars[ci], py: lineReadings(line.zh)[ci].p, canGrow: ci + 1 < chars.length && isHan(chars[ci + 1]) };
  render();
}

    setStatus: () => { const v = byId('vocab', id); if (v && status(v) !== el.dataset.v) { store.put('vocab', { ...v, srs: srsForStatus(v, el.dataset.v) }); toast(`${v.hanzi} → ${STATUS_LABEL[el.dataset.v]}`); } },
    delVocab: () => { closeDialog(); removeWithUndo('vocab', id, byId('vocab', id)?.hanzi || 'word'); },
    delGrammar: () => removeWithUndo('grammar', id, 'grammar point'),
    delText: () => { removeWithUndo('texts', id, 'text'); location.hash = '#/texts'; },
    delExercise: () => removeWithUndo('exercises', id, 'answer'),
    delLesson: () => { const c = lessonCounts(id); if (c.vocab + c.grammar + c.texts + c.exercises && !confirm('Delete this lesson? Its words, texts and grammar stay in your library, just without a lesson.')) return; removeWithUndo('lessons', id, 'lesson'); location.hash = '#/lessons'; },
    resolveEx: () => { const x = byId('exercises', id); store.put('exercises', { ...x, resolved: !x.resolved }); },
    exFilter: () => { ui.ex.filter = el.dataset.v; render(); },
    speak: () => speak(el.dataset.text),
    toggleSetting: () => { settings[el.dataset.key] = !settings[el.dataset.key]; saveSettings(); render(); },
    rSize: () => { settings.readerSize = Math.min(44, Math.max(20, settings.readerSize + Number(el.dataset.d))); saveSettings(); ui.pop = null; render(); },
    tapChar: () => charPopup(el),
    closePop: () => { ui.pop = null; render(); },
    growPop: () => { const p = ui.pop; const t = byId('texts', p.textId); const line = parseTextLines(t.body)[p.line]; const chars = [...line.zh]; const rd = lineReadings(line.zh); p.b += 1; p.word = chars.slice(p.a, p.b).join(''); p.py = rd.slice(p.a, p.b).map(r => r.p).join(' '); p.canGrow = p.b < chars.length && isHan(chars[p.b]); p.v = S.vocab.find(v => v.hanzi === p.word) || null; render(); },
    addFromText: () => { const p = ui.pop; const t = byId('texts', p.textId); vocabForm({}, { hanzi: el.dataset.word, py: p.py, example: el.dataset.ctx, lesson: t?.lesson }); },
    editTrans: () => {
      const t = byId('texts', id); if (!t) return;
      const li = Number(el.dataset.line);
      const line = parseTextLines(t.body)[li]; if (!line) return;
      const en = prompt(`Translation for:\n${line.zh}`, line.en || '');
      if (en === null) return;
      let n = -1;
      const body = String(t.body || '').split('\n').map(raw => {
        if (!raw.trim()) return raw;
        n += 1;
        if (n !== li) return raw;
        const zhPart = raw.split(/\s*[|｜¦]\s*/)[0].trim();
        return en.trim() ? `${zhPart} | ${en.trim()}` : zhPart;
      }).join('\n');
      store.put('texts', { ...t, body });
    },
    toggleSaved: () => { const t = byId('texts', id); const s = new Set(t.saved || []); const li = Number(el.dataset.line); s.has(li) ? s.delete(li) : s.add(li); store.put('texts', { ...t, saved: [...s] }); },
    startReview: () => startReview(),
    endReview: () => { ui.rv = null; render(); },
    flip: () => { ui.rv.flipped = true; render(); },
    rate: () => rate(Number(el.dataset.r)),
    rvDir: () => { settings.dir = el.dataset.v; saveSettings(); if (ui.rv) ui.rv.flipped = false; render(); },
    setPy: () => { settings.pyStyle = el.dataset.v; saveSettings(); render(); },
    setTheme: () => { settings.theme = el.dataset.v; saveSettings(); applyTheme(); render(); },
    export: () => { const blob = new Blob([JSON.stringify({ app: 'hanzi-notes', version: 1, exported: new Date().toISOString(), data: { ...S } }, null, 2)], { type: 'application/json' }); const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = `hanzi-notes-${dayKey()}.json`; a2.click(); URL.revokeObjectURL(a2.href); },
    signIn: () => signIn(),
    signOut: () => signOutNow(),
    gotoGrammar: () => { ui.grammar.q = el.dataset.q; },
  };
  if (acts[a]) { if (el.tagName === 'BUTTON' && el.type !== 'submit') e.preventDefault(); await acts[a](); }
});
function showVocabSheet(id) {
  const v = byId('vocab', id); if (!v) return;
  formCtx = null;
  modal.innerHTML = `<div class="dlg"><header>${esc(v.hanzi)}<button type="button" class="btn ghost icon" style="margin-left:auto" data-act="closeDlg" aria-label="Close">✕</button></header><div class="content">${vocabDetail(v)}</div></div>`;
  if (!modal.open) modal.showModal();
}
// close the word popup when clicking elsewhere (DOM-only, so the click itself still lands)
document.addEventListener('pointerdown', e => {
  if (ui.pop && !e.target.closest('.pop') && !e.target.closest('.ch')) {
    ui.pop = null;
    document.querySelectorAll('#view .pop').forEach(p => p.remove());
    document.querySelectorAll('#view .ch.hl').forEach(c => c.classList.remove('hl'));
  }
});

document.addEventListener('submit', async e => {
  if (e.target.id === 'dlgForm') { e.preventDefault(); await submitDialog(new FormData(e.target)); }
  if (e.target.id === 'qaForm') {
    e.preventDefault();
    const qa = ui.qa; if (!qa.h || !qa.en) return;
    await store.put('vocab', { hanzi: qa.h.trim(), meaning: qa.en.trim(), py: normPinyin(qa.py) || autoPinyin(qa.h), pos: qa.pos, lesson: lastLesson()?.id || '' });
    toast(`Added ${qa.h}`);
    ui.qa = { h: '', py: '', pyEdited: false, en: '', pos: qa.pos };
    render(); $('#qaH')?.focus();
  }
  if (e.target.id === 'qForm') {
    e.preventDefault();
    const v = $('#qIn').value.trim(); if (!v) return;
    store.setMeta({ questions: [...(S.meta.questions || []), { id: newId(), text: v, done: false }] });
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (e.isComposing) return;
  if (t.id === 'qaH') { ui.qa.h = t.value; if (!ui.qa.pyEdited) { ui.qa.py = autoPinyin(t.value); $('#qaPy').value = ui.qa.py; } $('#qaPreview').innerHTML = ui.qa.py ? pyHTML(ui.qa.py) : ''; }
  else if (t.id === 'qaPy') { ui.qa.py = t.value; ui.qa.pyEdited = !!t.value; $('#qaPreview').innerHTML = pyHTML(normPinyin(t.value)); }
  else if (t.id === 'qaEn') ui.qa.en = t.value;
  else if (t.id === 'vq') { ui.vocab.q = t.value; render(); }
  else if (t.id === 'gq') { ui.grammar.q = t.value; render(); }
  else if (t.id === 'mSearch') { ui.q = t.value; render(); }
  else if (t.id === 'globalSearch') { ui.q = t.value; if (ui.route !== 'search') location.hash = '#/search'; else render(); }
  else if (t.id === 'fH' && formCtx && !formCtx.pyEdited) { const py = autoPinyin(t.value); $('#fPy').value = py; $('#fPyPrev').innerHTML = pyHTML(py); }
  else if (t.id === 'fPy' && formCtx) { formCtx.pyEdited = !!t.value; $('#fPyPrev').innerHTML = pyHTML(normPinyin(t.value)); }
});
// IME: re-run after composition finishes (input events during composition are skipped)
document.addEventListener('compositionend', e => setTimeout(() => e.target.dispatchEvent(new Event('input', { bubbles: true })), 0));

document.addEventListener('change', async e => {
  const t = e.target, c = t.dataset.change;
  if (t.id === 'qaPos') { ui.qa.pos = t.value; settings.lastPos = t.value; saveSettings(); }
  if (!c) return;
  if (c === 'vLesson') { ui.vocab.lesson = t.value; render(); }
  if (c === 'gLesson') { ui.grammar.lesson = t.value; render(); }
  if (c === 'doneQ') store.setMeta({ questions: (S.meta.questions || []).map(q => q.id === t.dataset.id ? { ...q, done: true } : q) });
  if (c === 'newPer') { settings.newPerSession = Math.max(0, Number(t.value) || 0); saveSettings(); render(); }
  if (c === 'rate') { settings.rate = Number(t.value); saveSettings(); }
  if (c === 'import') {
    const file = t.files[0]; if (!file) return;
    try {
      const json = JSON.parse(await file.text()); const data = json.data || json;
      let n = 0;
      for (const coll of COLLS) if (Array.isArray(data[coll])) { const add = data[coll].filter(x => x && x.id); await store.putMany(coll, add); n += add.length; }
      if (data.meta) await store.setMeta(data.meta);
      toast(`Imported ${plural(n, 'item')}`);
    } catch (err) { toast('Import failed: ' + err.message); }
    t.value = '';
  }
});

document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if (CLOUD && sync.auth !== 'in') return;
  if (e.key === 'Escape' && ui.pop) { ui.pop = null; render(); return; }
  if (modal.open || typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (ui.route === 'review') {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!ui.rv) { if (dueList().length) startReview(); } else if (!ui.rv.flipped && ui.rv.queue[ui.rv.i]) { ui.rv.flipped = true; render(); } return; }
    if (ui.rv?.flipped && /^[1-4]$/.test(e.key)) { rate(Number(e.key)); return; }
  }
  if (e.key === '/') { e.preventDefault(); const s = matchMedia('(max-width:760px)').matches ? null : $('#globalSearch'); if (s) s.focus(); else location.hash = '#/search'; }
  else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); vocabForm(); }
  else if (e.key === 'r' || e.key === 'R') location.hash = '#/review';
});
modal.addEventListener('close', () => { formCtx = null; });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { };

/* =====================================================================
   9. BOOT
   ===================================================================== */
parseRoute();
if (CLOUD) {
  render(); // shows "Connecting…" until Firebase reports the sign-in state
  initCloud().catch(err => { console.error(err); sync.auth = 'out'; sync.authMsg = 'Could not reach Firebase: ' + err.message + '. Check your connection and reload.'; updateSync(); render(); });
} else {
  loadLocal();
  render();
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
</html>
